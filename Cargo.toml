[workspace]
resolver = "3"
members = ["crates/librift", "crates/riftd", "crates/rift-reality", "crates/rift-trust", "crates/rift-app"]
# Приложение тянет Tauri и системные библиотеки WebView: в обычный `cargo build/test` и CI не входит (`cargo build -p rift-app`).
default-members = ["crates/librift", "crates/riftd", "crates/rift-reality", "crates/rift-trust"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ZeniFlow/rift"

[workspace.dependencies]
anyhow = "1"
iroh = "1.3"
tokio = { version = "1", features = ["full"] }
