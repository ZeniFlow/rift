name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [flat, nat, names]
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/run.sh ${{ matrix.scenario }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.scenario }}-log
          path: tests/e2e/e2e-${{ matrix.scenario }}.log
          if-no-files-found: ignore

  app:
    # Окно браузера (Tauri): только сборка. Проверки WebView (`rift-app selftest-ui`) нужен экран, на раннерах их нет.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rift-app --locked
