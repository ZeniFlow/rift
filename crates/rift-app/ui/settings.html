<!doctype html>
<html lang="ru" data-motion="system" data-blur="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Настройки</title>
<link rel="stylesheet" href="kit.css">
<style>
  html, body { background: var(--bg); min-height: 100%; user-select: auto; font-size: 14px; }
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 14px clamp(16px, 4vw, 40px); background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .search { position: relative; flex: 1; max-width: 480px; margin-left: auto; }
  .search svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; color: var(--text-3); pointer-events: none; }
  .search input { width: 100%; height: 38px; padding: 0 14px 0 38px; border: 1px solid var(--line); border-radius: var(--r-full); background: var(--field); color: var(--text); font: inherit; transition: border-color calc(120ms * var(--m)) var(--ease), box-shadow calc(120ms * var(--m)) var(--ease); }
  .search input::placeholder { color: var(--text-3); }
  .search input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .layout { display: grid; grid-template-columns: 220px minmax(0, 720px); gap: clamp(20px, 4vw, 56px); justify-content: center; padding: 24px clamp(16px, 4vw, 40px) 72px; }
  nav.side { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  nav.side a { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 14px; border-radius: var(--r-full); color: var(--text-2); text-decoration: none; transition: background-color calc(120ms * var(--m)) var(--ease), color calc(120ms * var(--m)) var(--ease); }
  nav.side a:hover { background: var(--raised); color: var(--text); }
  nav.side a[aria-current="true"] { background: var(--raised-2); color: var(--text); }
  nav.side a svg { color: var(--text-3); } nav.side a[aria-current="true"] svg { color: var(--accent); }
  main { min-width: 0; }
  section.group { margin-bottom: 28px; scroll-margin-top: 84px; animation: rise calc(260ms * var(--m)) var(--ease) both; }
  section.group h2 { margin: 0 0 10px 4px; font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; }
  .card { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--field); }
  .card .row { padding: 14px 18px; border-top: 1px solid var(--line); }
  .card .row:first-child { border-top: 0; }
  .card dl.facts { margin: 0; padding: 4px 18px; }
  .card dl.facts dt, .card dl.facts dd { padding: 11px 0; }
  .card dl.facts dt:first-of-type, .card dl.facts dt:first-of-type + dd { border-top: 0; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .empty { display: none; padding: 48px 0; text-align: center; color: var(--text-3); }
  .empty.show { display: block; }
  .about { padding: 18px; color: var(--text-2); line-height: 1.6; }
  .about p { margin: 0 0 8px; } .about p:last-child { margin: 0; }
  [hidden] { display: none !important; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 820px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav.side { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; margin: 0 -2px; }
    nav.side a { flex: none; }
    .topbar { flex-wrap: wrap; } .search { max-width: none; margin-left: 0; flex-basis: 100%; }
  }
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></symbol>
  <symbol id="i-motion" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
  <symbol id="i-network" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
</svg>

<header class="topbar">
  <h1>Настройки</h1>
  <label class="search">
    <svg class="i"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Поиск по настройкам" autocomplete="off" spellcheck="false" aria-label="Поиск по настройкам">
  </label>
</header>

<div class="layout">
  <nav class="side" aria-label="Разделы" id="nav"></nav>
  <main id="main"></main>
</div>

<script src="kit.js"></script>
<script>
  const { h, icon, ui } = Kit;
  const { invoke } = window.__TAURI__.core;
  const { listen, emit } = window.__TAURI__.event;
  const short = (hex) => (hex && hex.length > 14 ? `${hex.slice(0, 8)}…${hex.slice(-4)}` : hex || '');

  /* Описание страницы: разделы и настройки. Добавить настройку — добавить строку сюда и ключ в settings.rs. */
  const GROUPS = [
    { id: 'appearance', title: 'Внешний вид', icon: 'palette', rows: [
      { key: 'accent', label: 'Акцентный цвет', desc: 'Цвет кнопок, переключателей и выделения в интерфейсе браузера.', ctl: 'swatches' },
      { key: 'blur', label: 'Размытие фона', desc: 'Фон за меню и окнами размывается средствами системы.', ctl: 'segmented', needsBlur: true,
        options: [{ value: 'off', label: 'Выкл' }, { value: 'soft', label: 'Мягкое' }, { value: 'strong', label: 'Сильное' }] },
      { key: 'dim', label: 'Затемнение за окнами', desc: 'Насколько темнеет страница за модальными окнами.', ctl: 'range', min: 0, max: 80, step: 5 },
    ] },
    { id: 'privacy', title: 'Конфиденциальность', icon: 'shield', rows: [
      { key: 'save_history', label: 'Сохранять историю', desc: 'Открытые страницы записываются на этом устройстве и подсказывают, что открывали раньше. Наружу история не уходит.', ctl: 'switch' },
      { label: 'Очистить историю', desc: 'Удалит все записи о посещённых страницах. Закладки останутся.', ctl: 'button', btn: 'Очистить', action: 'clear_history' },
    ] },
    { id: 'motion', title: 'Движение', icon: 'motion', rows: [
      { key: 'motion', label: 'Анимации', desc: '«Системные» следуют настройке «Уменьшение движения» в системе.', ctl: 'segmented',
        options: [{ value: 'system', label: 'Системные' }, { value: 'full', label: 'Полные' }, { value: 'reduced', label: 'Сниженные' }, { value: 'off', label: 'Выкл' }] },
    ] },
    { id: 'addresses', title: 'Адреса', icon: 'globe', rows: [
      { key: 'rift_first', label: 'Сначала искать в Rift', desc: 'Адрес без схемы, например shop.brand, сначала открывается в сети Rift, а не в интернете.', ctl: 'switch' },
    ] },
  ];
  const NAV = [...GROUPS.map((g) => [g.id, g.title, g.icon]), ['network', 'Сеть', 'network'], ['about', 'О программе', 'info']];

  let state = {}, info = {}, caps = {};

  const ACTIONS = {
    async clear_history() {
      const ok = await invoke('overlay_ask', { spec: { kind: 'confirm', title: 'Очистить историю?', text: 'Все записи о посещённых страницах будут удалены. Закладки останутся.', confirmLabel: 'Очистить', danger: true } });
      if (ok === true) { await invoke('history_clear'); notify('ok', 'История очищена'); }
    },
  };

  function control(r) {
    const patch = (v) => invoke('set_settings', { patch: { [r.key]: v } }).then(apply).catch((e) => notify('bad', 'Не удалось сохранить', String(e)));
    if (r.ctl === 'button') return h('button', { class: 'button', 'data-action': r.action, onclick: () => ACTIONS[r.action]() }, r.btn);
    switch (r.ctl) {
      case 'swatches': return ui.swatches({ value: state[r.key], onChange: patch });
      case 'switch': return ui.switch({ label: r.label, value: state[r.key], onChange: patch });
      case 'range': return ui.range({ value: state[r.key], min: r.min, max: r.max, step: r.step, label: r.label, onChange: (v) => patch(v) });
      case 'segmented': return ui.segmented({ label: r.label, value: state[r.key], options: r.options, disabled: r.needsBlur && !caps.blur, onChange: patch });
    }
  }

  const notify = (tone, title, text) => invoke('overlay_open', { spec: { kind: 'toast', tone, title, text } }).catch(() => {});

  function render() {
    const main = document.getElementById('main'); main.textContent = '';
    for (const g of GROUPS) {
      main.append(h('section', { class: 'group', id: g.id, 'data-group': g.id }, h('h2', {}, g.title),
        h('div', { class: 'card' }, g.rows.map((r) => {
          const row = ui.row({ label: r.label, desc: r.needsBlur && !caps.blur ? 'Системное размытие доступно только на macOS. Здесь окна рисуются без него.' : r.desc, control: control(r) });
          row.dataset.setting = r.key || r.action; row.dataset.text = `${r.label} ${r.desc} ${g.title}`.toLowerCase();
          return row;
        }))));
    }
    const facts = [['Корневой ключ', short(info.root)], ['Свидетели', info.quorum], ['Резолверы', String(info.resolvers)], ['Шлюз', info.gateway], ['Этот узел', short(info.node)]];
    main.append(h('section', { class: 'group', id: 'network', 'data-group': 'network' }, h('h2', {}, 'Сеть'),
      h('div', { class: 'card', 'data-text': 'сеть корневой ключ свидетели резолверы шлюз узел' }, h('dl', { class: 'facts' }, facts.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])))));
    main.append(h('section', { class: 'group', id: 'about', 'data-group': 'about' }, h('h2', {}, 'О программе'),
      h('div', { class: 'card', 'data-text': 'о программе rift версия данные' },
        h('div', { class: 'about' }, h('p', {}, `Rift ${info.version}`), h('p', {}, 'Браузер для сети, где адрес сайта проверяется подписями, а не доверием к посреднику.'), h('p', { class: 'mono', style: { color: 'var(--text-3)', fontSize: '12px' } }, `Данные: ${info.data_dir}`)),
        h('div', { class: 'row foot' }, h('div', {}, h('div', { class: 'label' }, 'Сбросить настройки'), h('div', { class: 'desc' }, 'Вернёт внешний вид, анимации и поиск адресов к значениям по умолчанию.')),
          h('button', { class: 'button', id: 'reset' }, icon('reset', 's'), 'Сбросить')))));
    main.append(h('div', { class: 'empty', id: 'empty' }, 'Ничего не найдено. Попробуйте другое слово.'));
    document.getElementById('reset').addEventListener('click', resetAll);
    filter();
  }

  function renderNav() {
    const nav = document.getElementById('nav'); nav.textContent = '';
    for (const [id, title, ico] of NAV) nav.append(h('a', { href: `#${id}`, 'data-nav': id, onclick: (e) => { e.preventDefault(); document.getElementById(id)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches || state.motion === 'off' ? 'auto' : 'smooth', block: 'start' }); } }, icon(ico), title));
  }

  /* Подсветка раздела в боковой панели по прокрутке. */
  const seen = new Map();
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) seen.set(e.target.id, e.isIntersecting ? e.boundingClientRect.top : null);
    const cur = [...seen.entries()].filter(([, t]) => t !== null).sort((a, b) => a[1] - b[1])[0];
    if (cur) document.querySelectorAll('nav.side a').forEach((a) => a.setAttribute('aria-current', String(a.dataset.nav === cur[0])));
  }, { rootMargin: '-84px 0px -60% 0px' });

  function filter() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    let any = false;
    document.querySelectorAll('section.group').forEach((s) => {
      let shown = 0;
      s.querySelectorAll('[data-text]').forEach((el) => { const hit = !q || el.dataset.text.includes(q); el.hidden = !hit; if (hit) shown++; });
      s.hidden = shown === 0; any ||= shown > 0;
    });
    document.getElementById('empty').classList.toggle('show', !any);
  }

  async function resetAll() {
    const ok = await invoke('overlay_ask', { spec: { kind: 'confirm', title: 'Сбросить настройки?', text: 'Внешний вид, анимации и поиск адресов вернутся к значениям по умолчанию. Адреса и сайты не изменятся.', confirmLabel: 'Сбросить', danger: true } });
    if (ok === true) { apply(await invoke('reset_settings')); notify('ok', 'Настройки сброшены'); }
  }

  function apply(s) {
    state = s; Kit.applySettings(s);
    // Перерисовать элементы, чтобы они показывали актуальные значения (сброс, правка из другого окна).
    const y = scrollY; render(); scrollTo(0, y);
    document.querySelectorAll('section.group').forEach((el) => io.observe(el));
    emit('page-state', { page: 'settings', settings: s });
  }

  document.getElementById('q').addEventListener('input', filter);
  listen('settings', (e) => { if (JSON.stringify(e.payload) !== JSON.stringify(state)) apply(e.payload); });

  (async () => {
    [caps, info, state] = await Promise.all([invoke('get_caps'), invoke('get_info'), invoke('get_settings')]);
    Kit.caps.blur = caps.blur; renderNav(); apply(state);
    emit('page-state', { page: 'settings', ready: true, settings: state });
  })();
</script>
</body>
</html>
