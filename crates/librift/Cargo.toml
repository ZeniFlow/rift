[package]
name = "librift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
bytes = "1.12.1"
iroh.workspace = true
iroh-mdns-address-lookup = "0.6"
rift-reality = { version = "0.0.1", path = "../rift-reality" }
rift-trust = { version = "0.0.1", path = "../rift-trust" }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio.workspace = true
tracing = "0.1.44"
tun-rs = { version = "2.8", features = ["async_tokio"] }
url = "2"

[dev-dependencies]
iroh = { version = "1.3", features = ["test-utils"] }
