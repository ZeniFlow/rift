[package]
name = "rift-trust"
description = "Цепочка доверия Rift: root → control → зона → регистратор → домен. Проверка оффлайн."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "rift-ca"
path = "src/bin/rift-ca.rs"
